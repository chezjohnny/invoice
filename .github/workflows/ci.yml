name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, with no push: the audits catch newly published vulnerabilities.
  schedule:
    - cron: "0 5 * * 1"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy app tests

      # Production is SQLite: prove the migration chain applies on it, and
      # that it covers every model change.
      - name: Migrations
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Tests
        run: uv run pytest

      - name: Audit dependencies
        run: uv run pip-audit --skip-editable

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --watch=false

      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm audit
