# One pull request per ecosystem and month for minor and patch releases.
# Angular, NgRx and TypeScript move together through `ng update`; the Docker
# base images follow Node's major in .nvmrc and nginx's stable branch, so they
# are bumped by hand.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    # Refresh uv.lock only: pyproject.toml keeps its minimum versions.
    versioning-strategy: lockfile-only
    schedule:
      interval: monthly
    groups:
      backend:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      frontend:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@angular/*"
        update-types: [version-update:semver-major]
      - dependency-name: "@ngrx/*"
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
