# PRODUCTION stack, deployed on the VPS by the post-receive hook
# (docker compose up -d --build). Development lives in docker-compose.dev.yml:
# PostgreSQL and hot reload.
#
# No port is published on the host: Traefik reaches the `web` container through
# the proxy-network.
services:
  api:
    build: ./backend
    container_name: invoice-api
    restart: unless-stopped
    environment:
      # SQLite is plenty at single-user SME scale and makes backups trivial
      # (one file). The four slashes are intentional: absolute /data/invoice.db.
      INVOICE_DATABASE_URL: ${INVOICE_DATABASE_URL:-sqlite+aiosqlite:////data/invoice.db}
      INVOICE_SECRET_KEY: ${INVOICE_SECRET_KEY:?INVOICE_SECRET_KEY must be set in .env}
      INVOICE_ACCESS_TOKEN_EXPIRE_MINUTES: ${INVOICE_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      INVOICE_REFRESH_TOKEN_EXPIRE_DAYS: ${INVOICE_REFRESH_TOKEN_EXPIRE_DAYS:-7}
    volumes:
      # The SQLite file lives outside the container and outside the repository:
      # the hook's `checkout -f` cannot clobber it, and backing up this one
      # directory is enough.
      - ${INVOICE_DATA_DIR:-./data}:/data
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - default

  web:
    build:
      context: ./frontend
    container_name: invoice
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default
      - proxy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.invoice.rule=Host(`app.saudan-vins.ch`)"
      - "traefik.http.routers.invoice.entrypoints=websecure"
      - "traefik.http.routers.invoice.tls.certresolver=letsencrypt"
      - "traefik.http.services.invoice.loadbalancer.server.port=80"

networks:
  proxy-network:
    external: true
