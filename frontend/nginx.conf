upstream invoice_api {
    server api:8000;
}

# Traefik terminates TLS and forwards X-Forwarded-Proto: honour it instead of
# rewriting $scheme, which would always be "http" in here.
map $http_x_forwarded_proto $invoice_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Sign-in attempts per client IP: slows down password guessing.
limit_req_zone $binary_remote_addr zone=invoice_auth:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The client's address, from Traefik: this container publishes no port and
    # is only reached over the Docker networks, so only private peers are trusted.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Container probe: deliberately independent of the API, so a healthy
    # frontend is distinguishable from a broken backend.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # The API lives under /api, mirroring the dev proxy (proxy.conf.mjs):
    # the trailing slash is what makes nginx strip the prefix.
    location /api/ {
        proxy_pass http://invoice_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $invoice_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
        # PDF generation: give fpdf2 room to breathe on large invoices.
        proxy_read_timeout 120s;

        # Password guessing: a few attempts in a row, then 429. Not /auth/refresh:
        # its token cannot be guessed, and tabs refreshing together must not fail.
        location = /api/auth/login {
            limit_req zone=invoice_auth burst=5 nodelay;
            limit_req_status 429;
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://invoice_api;
        }
    }

    # Angular emits content-hashed filenames, so these can be cached forever.
    location ~* \.(?:js|css|woff2?|ttf|png|jpe?g|gif|svg|ico|webp)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        # A location's own add_header drops the server's: repeat them.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # index.html must never be cached: it is what points to the new bundles
    # after a deployment.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Client-side routing: any unknown URL falls back to the application.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
